name: Release APK

# Cara rilis versi baru:
#   git tag v1.1.0 && git push origin v1.1.0
# Workflow: build APK release signed → GitHub Release (arsip)
#   → upload ke VPS (landing download langsung) + versions.json.
# Butuh Secrets: KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD,
#   STORE_PASSWORD, PROD_API_URL
# Butuh Variables (atau Secrets): tidak ada — cukup di atas.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    # Rilis butuh izin tulis (repo memakai default read-only).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # Build native (dartcv4/OpenCV) + Gradle memakan belasan GB.
      # Tanpa ini step SCP gagal: `gzip: No space left on device`
      # saat drone-scp men-tar APK di /tmp (kasus v1.0.4).
      # Catatan: JANGAN hapus /usr/local/lib/android (Android SDK)
      # dan /opt/hostedtoolcache (Flutter/Java/Node) — dibutuhkan build.
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          mkdir -p "$GITHUB_WORKSPACE/tmp-scp"
          df -h

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore keystore + key.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat > android/app/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.PROD_API_URL }}

      - name: Rename APK with version
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/ar-mobile-learning-${TAG}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/app/outputs/flutter-apk/ar-mobile-learning-*.apk
          generate_release_notes: true

      # Mirror ke VPS agar landing page download langsung (tanpa GitHub).
      # GitHub Release tetap dipertahankan sebagai arsip/cadangan.
      - name: Generate versions.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK=$(ls build/app/outputs/flutter-apk/ar-mobile-learning-*.apk | head -1)
          NOTES=$(gh release view "$TAG" --json body --jq '.body // ""')
          python3 - "$TAG" "$APK" "$NOTES" <<'PYEOF'
          import json, os, sys, datetime
          tag, apk, notes = sys.argv[1], sys.argv[2], sys.argv[3]
          size = os.path.getsize(apk)
          data = {
              "latest": tag,
              "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "download_base": "https://download.arlearning.my.id/downloads/",
              "files": [{
                  "tag": tag,
                  "file": os.path.basename(apk),
                  "url": "https://download.arlearning.my.id/downloads/" + os.path.basename(apk),
                  "size_bytes": size,
                  "size_mb": round(size / 1048576, 1),
                  "notes": notes,
              }],
          }
          out = "build/app/outputs/flutter-apk/versions.json"
          with open(out, "w") as f:
              json.dump(data, f)
          print("versions.json written for", tag)
          PYEOF

      - name: Upload APK to landing server
        uses: appleboy/scp-action@v1
        env:
          # drone-scp men-tar file di os.TempDir(); arahkan ke workspace
          # agar tidak memakai /tmp yang sempit saat disk penuh.
          TMPDIR: ${{ github.workspace }}/tmp-scp
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/build/app/outputs/flutter-apk/ar-mobile-learning-*.apk,frontend/build/app/outputs/flutter-apk/versions.json"
          target: "/var/www/ar-mobile-learning/landing/downloads/"
          strip_components: 5

      - name: Prune old APKs (keep 3)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/ar-mobile-learning/landing/downloads
            ls -t ar-mobile-learning-*.apk 2>/dev/null | tail -n +4 | xargs -r rm -f
            ls -la
