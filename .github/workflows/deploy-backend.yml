name: Deploy Backend

# Jalan otomatis tiap push ke main yang menyentuh backend/landing.
# Deploy menunggu workflow CI untuk commit yang sama selesai dengan status
# success, sehingga kode yang gagal test tidak pernah sampai ke produksi.
# Butuh Secrets (repo Settings → Secrets → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "landing/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  actions: read
  contents: read

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait until CI completes for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            run=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&per_page=1")
            status=$(echo "$run" | jq -r '.workflow_runs[0].status // "missing"')
            conclusion=$(echo "$run" | jq -r '.workflow_runs[0].conclusion // "null"')

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI success for ${SHA}"
                exit 0
              fi
              echo "::error::CI selesai dengan status '${conclusion}'. Deploy dibatalkan."
              exit 1
            fi

            echo "CI status: ${status} (percobaan ${attempt}/60)"
            sleep 15
          done

          echo "::error::Timeout menunggu CI untuk ${SHA}."
          exit 1

  deploy:
    name: Deploy via SSH
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PATH }}
            git fetch origin main
            git checkout -f "${{ github.sha }}"
            cd backend
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart || true
            echo "Deploy OK: $(date -u) (${GITHUB_SHA:-${{ github.sha }}})"
