plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.frontend"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    buildFeatures {
        compose true
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.frontend"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    dependencies {
        // Opsi 3: ARCore session + GLB renderer native (SceneView 4.x = successor of Sceneform,
        // actively maintained: Filament + ARCore + AugmentedImageNode + glTF/GLB loader).
        implementation "io.github.sceneview:arsceneview:4.32.0"
        implementation platform("androidx.compose:compose-bom:2026.06.01")
        implementation "androidx.compose.ui:ui"
        implementation "androidx.compose.ui:ui-tooling-preview"
        implementation "androidx.compose.runtime:runtime"
        implementation "androidx.compose.foundation:foundation"
        implementation "com.google.ar:core:1.54.0"
    }
}

flutter {
    source = "../.."
}
